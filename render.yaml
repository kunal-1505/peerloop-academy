databases:
  - name: peerloop-db
    plan: free
    databaseName: peerloop
    user: peerloop
    ipAllowList: []

services:
  - type: web
    name: peerloop-academy
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: peerloop-db
          property: connectionString
